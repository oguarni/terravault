name: API Collection

# Runs the Postman collection in postman/ with Newman against a live API
# process. The pytest suite exercises the handlers in-process through
# TestClient; this job checks the same endpoints over real HTTP, including
# the multipart upload, the API-key header and the published OpenAPI document.

on:
  pull_request:
    branches: [main]
    paths:
      - 'terravault/**'
      - 'postman/**'
      - 'test_files/**'
      - 'requirements.txt'
      - '.github/workflows/api-collection.yml'
  push:
    branches: [main]
    paths:
      - 'terravault/**'
      - 'postman/**'
      - 'test_files/**'
      - 'requirements.txt'
      - '.github/workflows/api-collection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-collection-${{ github.ref }}
  cancel-in-progress: true

# PostgreSQL and Redis are deliberately absent. /health and /scan must answer
# without them: the lifespan handler tolerates a missing database and the rate
# limiter falls back to memory. A fresh checkout has no trained model either,
# so MLPredictor trains its synthetic baseline on startup; the collection
# asserts on the deterministic rule results, never on the ML score.
env:
  TERRAVAULT_ENVIRONMENT: development
  TERRAVAULT_DATABASE_URL: "postgresql+asyncpg://test:test@127.0.0.1:5432/test"
  TERRAVAULT_REDIS_URL: "redis://127.0.0.1:6379"
  TERRAVAULT_LOG_LEVEL: INFO
  NEWMAN_VERSION: 6.2.3

jobs:
  newman:
    name: Run Postman collection with Newman
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Exact version, and no install scripts: Newman needs none, and a
      # dependency's postinstall hook is the usual way a compromised package
      # runs code on the runner.
      - name: Install Newman
        run: npm install --global --ignore-scripts --no-audit --no-fund "newman@${NEWMAN_VERSION}"

      # A key generated per run, masked in the log, that exists only for this
      # job. Nothing is stored as a repository secret.
      - name: Create a throwaway API key
        run: |
          key=$(python -c "import secrets; print('tv-ci-' + secrets.token_urlsafe(24))")
          echo "::add-mask::$key"
          hash=$(python -c "import bcrypt, sys; print(bcrypt.hashpw(sys.argv[1].encode(), bcrypt.gensalt()).decode())" "$key")
          {
            echo "TV_API_KEY=$key"
            echo "TERRAVAULT_API_KEY_HASH=$hash"
          } >> "$GITHUB_ENV"

      - name: Start the API
        run: |
          python -m uvicorn terravault.api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::API did not report healthy within 90 seconds"
          cat uvicorn.log
          exit 1

      - name: Run the collection
        run: |
          newman run postman/terravault-api.postman_collection.json \
            --environment postman/terravault-local.postman_environment.json \
            --env-var "baseUrl=http://127.0.0.1:8000" \
            --env-var "apiKey=${TV_API_KEY}" \
            --working-dir . \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml \
            --color off

      - name: Upload Newman report and API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-report
          path: |
            newman-results.xml
            uvicorn.log
          retention-days: 14
          if-no-files-found: warn
